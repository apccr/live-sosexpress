<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Aritmetia - SOS Express</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

a, a:visited {
	color: white;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: black;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
	background-color: black;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

		</style>
		
	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>
		<div id="status">
            <button onclick="initializeGodot()" style="
				width: 100vw;
				height: 100vh;
				background: transparent;
				border: none;
				cursor: pointer;
				position: absolute;
				top: 0; left: 0;
			">
			    <img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="" />
            </button>
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>
		<script src="index.js"></script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":34812216,"index.wasm":38047590},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4} || {};
const GODOT_THREADS_ENABLED = false || false;
const engine = new Engine(GODOT_CONFIG);
</script>
<script>
window.touchEnabled = false;
addEventListener("touchstart", () => {
	window.touchEnabled = true;
})

(function setupVirtualKeyboard() {
	const vkInput = document.getElementById('virtual-keyboard-input');
	let pendingText = '';

	window.godot_show_virtual_keyboard = function(existingText, cursorStart, cursorEnd, multiline, maxLength) {
		if (!window.touchEnabled) return;
		vkInput.value = existingText || '';
		pendingText = existingText || '';
		vkInput.style.pointerEvents = 'auto';
		vkInput.focus();
		try {
			const start = (cursorStart >= 0) ? cursorStart : existingText.length;
			const end   = (cursorEnd   >= 0) ? cursorEnd   : existingText.length;
			vkInput.setSelectionRange(start, end);
		} catch(e) {}
		vkInput.style.pointerEvents = 'none';
	};

	window.godot_hide_virtual_keyboard = function() {
		vkInput.blur();
		vkInput.value = '';
	};

	vkInput.addEventListener('input', function(e) {
		const newValue = vkInput.value;
		if (newValue.length > pendingText.length) {
			const added = newValue.slice(pendingText.length);
			for (const ch of added) {
				['keydown', 'keypress', 'keyup'].forEach(evType => {
					const ev = new KeyboardEvent(evType, {
						key: ch, code: 'Key' + ch.toUpperCase(),
						charCode: ch.charCodeAt(0), keyCode: ch.charCodeAt(0),
						which: ch.charCodeAt(0), bubbles: true, cancelable: true,
					});
					document.getElementById('canvas').dispatchEvent(ev);
				});
			}
		} else if (newValue.length < pendingText.length) {
			['keydown', 'keyup'].forEach(evType => {
				const ev = new KeyboardEvent(evType, {
					key: 'Backspace', code: 'Backspace',
					keyCode: 8, which: 8, bubbles: true, cancelable: true,
				});
				document.getElementById('canvas').dispatchEvent(ev);
			});
		}
		pendingText = newValue;
	});

	vkInput.addEventListener('keydown', function(e) {
		if (e.key === 'Enter') {
			const ev = new KeyboardEvent('keydown', {
				key: 'Enter', code: 'Enter',
				keyCode: 13, which: 13, bubbles: true, cancelable: true,
			});
			document.getElementById('canvas').dispatchEvent(ev);
		}
	});
})();

let initializeClicked = false;
function initializeGodot() {
    if (initializeClicked) { return; }
    initializeClicked = true;
	document.getElementById("canvas").requestFullscreen();
	if (typeof screen.orientation.lock !== 'undefined') {
		screen.orientation.lock('landscape').catch((e) => {})
	}
	const canvas = document.getElementById('canvas');
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');

	let initializing = true;
	let statusMode = '';
	canvas.style.display = "none";

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
			canvas.style.display = "block";
		}, displayFailureNotice);
	}
};
		</script>
	</body>
</html>
