<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Aritmetia - SOS Express</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: black;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: black;
	display: flex;
	justify-content: center;
	align-items: center;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-progress, #status-notice {
	display: none;
}
		</style>
		
	</head>
	<body>

		<!-- Input oculto -->
		<input id="mobileKeyboard" type="text"
			style="position:absolute; opacity:0; height:0; width:0;"
			autocorrect="off" autocapitalize="off" autocomplete="off">

		<canvas id="canvas"></canvas>

		<div id="status">
			<button onclick="initializeGodot()" style="
				width:100vw;height:100vh;background:transparent;border:none;">
				<img id="status-splash" src="index.png" />
			</button>
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
		</div>

		<script src="index.js"></script>

		<script>
const engine = new Engine({"args":[],"canvasResizePolicy":2,"emscriptenPoolSize":8,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":true,"fileSizes":{"index.pck":34812216,"index.wasm":38047590},"focusCanvas":true,"gdextensionLibs":[],"godotPoolSize":4} || {});
let initializeClicked = false;

function isMobile() {
	return /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
}

function forceKeyboard() {
	const input = document.getElementById("mobileKeyboard");

	// pequeño hack: focus + value trigger mejora compatibilidad
	input.value = " ";
	input.focus();

	// mover cursor
	input.setSelectionRange(1, 1);

	// opcional limpiar
	setTimeout(() => {
		input.value = "";
	}, 300);
}

function initializeGodot() {
	if (initializeClicked) return;
	initializeClicked = true;

	const canvas = document.getElementById("canvas");

	// 🔥 FULLSCREEN PRIMERO (CRÍTICO)
	canvas.requestFullscreen().then(() => {

		// 🎯 luego teclado con delay
		if (isMobile()) {
			setTimeout(() => {
				forceKeyboard();
			}, 400);
		}

	}).catch(() => {
		// fallback si fullscreen falla
		if (isMobile()) {
			forceKeyboard();
		}
	});

	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');

	canvas.style.display = "none";

	engine.startGame({
		onProgress: (current, total) => {
			if (current > 0 && total > 0) {
				statusProgress.value = current;
				statusProgress.max = total;
			}
		}
	}).then(() => {
		statusOverlay.remove();
		canvas.style.display = "block";
	});
}
		</script>
	</body>
</html>
